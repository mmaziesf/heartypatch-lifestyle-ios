# XcodeGen spec. Generate the project with:  xcodegen generate
# (brew install xcodegen). The .xcodeproj is a build artifact and is git-ignored.
name: HeartyPatchLifestyle
options:
  bundleIdPrefix: com.hpl
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
  Cloud: release   # optional: Release-like build that talks to the live hpl-cloud endpoint
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.7.0"     # bump CURRENT_PROJECT_VERSION for every TestFlight upload
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # set your team locally to run on a device
    # Cloud analysis endpoint (docs/m8-cloud-endpoint.md). Empty = on-device demo analyzer, nothing leaves the device.
    # HPL_CLOUD_PINS: comma-separated base64 pins from `hpl-cloud pin fullchain.pem` (current + backup key).
    HPL_CLOUD_ENDPOINT: ""
    HPL_CLOUD_PINS: ""
  configs:
    # Live endpoint (docs/deploy-fly.md). Debug/Release keep the empty defaults above = fully on-device.
    # Pins = leaf + intermediate SPKI; renew certs with certbot --reuse-key so these stay valid.
    Cloud:
      HPL_CLOUD_ENDPOINT: "https://heartypatch.app/v1/analyze"
      HPL_CLOUD_PINS: "JMvuYZpaHgO/IrCPe5RDm+Dq/fL/qeqSgjYQ6mpRSaU=,uVnyjs8i8IbTN0j/dhQYuoLYVYfhIa0bczhBt2SP4GQ="
packages:
  HPLCore: { path: Packages/HPLCore }
  HPLStore: { path: Packages/HPLStore }
  HPLHealth: { path: Packages/HPLHealth }
  HPLIngest: { path: Packages/HPLIngest }
  HPLInference: { path: Packages/HPLInference }
  HPLPipeline: { path: Packages/HPLPipeline }
  HPLBridge: { path: Packages/HPLBridge }
  HPLCloud: { path: Packages/HPLCloud }
  HPLUI: { path: Packages/HPLUI }
targets:
  HeartyPatchLifestyle:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [PrivacyInfo.xcprivacy]
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: HPLCore
      - package: HPLUI
      - package: HPLStore
      - package: HPLHealth
      - package: HPLIngest
      - package: HPLInference
      - package: HPLPipeline
      - package: HPLBridge
      - package: HPLCloud
      - sdk: HealthKit.framework
    entitlements:
      # Generated by XcodeGen (git-ignored like Info.plist). Architecture §9.3 / §10.
      path: Config/HeartyPatchLifestyle.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: HP Lifestyle
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        HPLCloudEndpoint: $(HPL_CLOUD_ENDPOINT)
        HPLCloudPublicKeyPins: $(HPL_CLOUD_PINS)
        # Architecture §9.3. Read-only: no NSHealthUpdateUsageDescription until write-back ships (M5 review).
        NSHealthShareUsageDescription: "Read sleep, heart, activity, body, and workout data to build daily summaries on your device. Only per-day totals are stored, and nothing leaves your iPhone."
        UIRequiredDeviceCapabilities: [healthkit]
        # M5 glasses bridge (docs/m5-glasses.md): signed .hplevent files arrive via share sheet / Files / "Open in".
        # Copied into the app (no open-in-place), then imported; the original stays wherever the companion put it.
        LSSupportsOpeningDocumentsInPlace: false
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hpl.lifestyle.hplevent
            UTTypeDescription: HP Lifestyle glasses events
            UTTypeConformsTo: [public.utf8-plain-text, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [hplevent]
              public.mime-type: [application/x-hplevent]
        CFBundleDocumentTypes:
          - CFBundleTypeName: HP Lifestyle glasses events
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.hpl.lifestyle.hplevent]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hpl.lifestyle
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # placeholder icon; replace before App Store submission
schemes:
  HeartyPatchLifestyle:
    build:
      targets:
        HeartyPatchLifestyle: all
    run:
      config: Debug
  HeartyPatchLifestyle-Cloud:
    build:
      targets:
        HeartyPatchLifestyle: all
    run:
      config: Cloud
    archive:
      config: Cloud
