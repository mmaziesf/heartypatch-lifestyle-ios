# Fly.io config for hpl-cloud. Step-by-step: ../docs/deploy-fly.md
#
# TLS PASSTHROUGH: the 443 port has handlers = [], so Fly's edge proxy forwards raw TCP and never decrypts.
# TLS 1.3 terminates inside hpl-cloud with your Let's Encrypt key, which is what the iOS public-key pin checks.
# Do NOT add "tls" or "http" handlers, an [http_service] block, or `fly certs add`: any of those makes Fly's edge
# present its own key (pins fail) and see request bodies in plaintext.
#
# REQUIRES A DEDICATED IPv4 (`fly ips allocate-v4`, paid). Raw TCP services do not work on Fly's shared IPv4,
# which routes by TLS SNI/HTTP Host and therefore needs Fly's handlers. Dedicated IPv6 is free and also works.
#
# The certificate and key are NOT in this file or the image: they are Fly secrets HPL_TLS_CERT_PEM and
# HPL_TLS_KEY_PEM, injected as env vars at boot (`fly secrets set ...`, see the doc).

app = "hpl-lifestyle-cloud"   # placeholder: Fly app names are global, change it if taken
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]
  dockerfile = "Dockerfile"

[env]
  HPL_ADDR = ":8443"
  HPL_ATTEST = "off"          # App Attest key ids can link requests from one install; leave off for personal use
  HPL_MAX_INFLIGHT = "16"

[[services]]
  protocol = "tcp"
  internal_port = 8443
  # No proxy_proto_options on purpose: the app never receives the client IP (it sees only Fly's proxy).
  auto_stop_machines = "stop"   # idle -> stopped, first request wakes it (adds ~1-2 s cold start)
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 443
    handlers = []               # raw TCP passthrough; required for pinning

  [services.concurrency]
    type = "connections"
    soft_limit = 16
    hard_limit = 32

  [[services.tcp_checks]]       # TCP connect only (no TLS handshake). Each check logs one fixed, IP-free
    interval = "60s"            # "http_server_error" warn line from the app; that noise is expected.
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
