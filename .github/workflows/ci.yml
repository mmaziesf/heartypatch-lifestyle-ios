name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spec:
    name: Spec schemas + PHI log check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "jsonschema>=4.23"
      - name: Validate JSON Schemas + fixtures (valid accepted, invalid rejected)
        run: python3 scripts/validate_specs.py
      - name: Schema round-trip (Python stand-in mirror of HPLCoreTests)
        run: python3 scripts/test_spec_roundtrip.py
      - name: No PHI in logs (print/NSLog/non-private Logger)
        run: scripts/check_no_phi_logging.sh
      - name: Egress boundary (networking only in HTTPSCloudTransport)
        run: scripts/check_egress_boundary.sh
      - name: App Store copy + privacy manifest (wellness framing, §13)
        run: python3 scripts/check_store_copy.py

  server:
    name: Cloud endpoint (Go, server/)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: No stray logging in handlers (only the outcome-only access log)
        run: |
          if grep -rnE 'fmt\.Print|log\.Print|log\.Fatal|slog\.(Info|Warn|Error|Debug)\(|\.Header\.Get\("(User-Agent|Cookie|Authorization)' internal --include=*.go | grep -v _test.go; then
            echo "Logging or identity-header reads in server/internal (only server.go's access log is allowed)"; exit 1
          fi
      - name: Tests (schema parity with Spec/ + Fixtures/, golden insights == iOS demo analyzer, log hygiene, pinning, App Attest)
        run: go test -race -count=1 ./...
      - name: Fuzz the payload decoder and the App Attest CBOR reader (short)
        run: |
          go test ./internal/api -run '^$' -fuzz FuzzDecode -fuzztime 20s
          go test ./internal/attest -run '^$' -fuzz FuzzDecodeAssertion -fuzztime 10s

  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - uses: actions/checkout@v7
      - run: swiftlint lint --strict --reporter github-actions-logging

  linux-packages:
    name: swift test (Linux, portable core)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: Packages/*/.build
          key: spm-linux-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved') }}
      - run: scripts/test_packages.sh

  macos-packages:
    name: swift test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - uses: actions/cache@v6
        with:
          path: Packages/*/.build
          key: spm-macos-${{ runner.os }}-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved') }}
      - run: scripts/test_packages.sh

  ios:
    name: iOS app build + package tests on simulator
    runs-on: macos-latest
    timeout-minutes: 45
    needs: [spec]
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen + xcbeautify
        run: brew install xcodegen xcbeautify
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick simulator
        id: sim
        run: echo "udid=$(scripts/ci/pick_simulator.sh)" >> "$GITHUB_OUTPUT"
      - name: Build app for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project HeartyPatchLifestyle.xcodeproj \
            -scheme HeartyPatchLifestyle \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath .derived \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
      - name: Privacy manifest is bundled
        run: test -f .derived/Build/Products/Debug-iphonesimulator/HeartyPatchLifestyle.app/PrivacyInfo.xcprivacy
      - name: Release build for device (unsigned; TestFlight archives are signed locally, docs/testflight-checklist.md)
        run: |
          set -o pipefail
          xcodebuild build \
            -project HeartyPatchLifestyle.xcodeproj \
            -scheme HeartyPatchLifestyle \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath .derived \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
      - name: Package tests on iOS simulator
        env:
          SIMULATOR_UDID: ${{ steps.sim.outputs.udid }}
        run: scripts/ci/xcodebuild_package_tests.sh
